name: Update TSA Data & Forecast

permissions:
  contents: write

on:
  schedule:
    - cron: '0 15 * * *'   # daily 
    - cron: '5 15 * * 1'   # Mondays 
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y numpy prophet cmdstanpy || true
          pip install --no-cache-dir -r requirements-train.txt

      - name: Update TSA data
        run: python scripts/update_data.py

      - name: Retrain (Mondays or manual runs)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '5 15 * * 1'
        run: python scripts/retrain_model.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with remote
        run: |
          git fetch origin ${{ github.ref_name }}
          git pull --rebase origin ${{ github.ref_name }} || true

      - name: Commit updates
        run: |
          git add data/*.csv || true
          git commit -m "📈 Auto update: TSA data and forecast" || echo "No changes"

      - name: Push
        run: git push origin HEAD:${{ github.ref_name }}
